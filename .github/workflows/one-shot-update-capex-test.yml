name: One-shot update capex regression

on:
  push:
    branches:
      - fix/coverage-engine-root-cause

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coverage-engine-root-cause
          fetch-depth: 0
      - name: Update stale Yahoo capex regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/data/yahoo-fundamentals.test.ts')
          text = path.read_text()
          replacements = [
              (
                  'it("prefers Yahoo PurchaseOfPPE for canonical cash capex when available", async () => {',
                  'it("prefers Yahoo CapitalExpenditure over narrower PurchaseOfPPE when both are available", async () => {',
              ),
              (
                  'expect(result.data.annualPeriods?.at(-1)?.capitalExpenditures).toBe(21_000);',
                  'expect(result.data.annualPeriods?.at(-1)?.capitalExpenditures).toBe(26_130);',
              ),
              (
                  'expect(result.data.trailingTwelveMonths?.capitalExpenditures).toBe(22_000);',
                  'expect(result.data.trailingTwelveMonths?.capitalExpenditures).toBe(26_551);',
              ),
              (
                  'expect(result.data.annualPeriods?.at(-1)?.provenance?.capitalExpenditures?.concept).toBe("annualPurchaseOfPPE");',
                  'expect(result.data.annualPeriods?.at(-1)?.provenance?.capitalExpenditures?.concept).toBe("annualCapitalExpenditure");',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one marker, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-update-capex-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/data/yahoo-fundamentals.test.ts .github/workflows/one-shot-update-capex-test.yml
          git commit -m "test: align Yahoo capex regression with reconciled semantics"
          git push origin HEAD:fix/coverage-engine-root-cause
