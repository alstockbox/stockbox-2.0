name: One-shot update capex regression

on:
  push:
    branches:
      - fix/coverage-engine-root-cause

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coverage-engine-root-cause
          fetch-depth: 0
      - name: Update stale Yahoo capex regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/data/yahoo-fundamentals.test.ts')
          text = path.read_text()
          old = '''  it("prefers Yahoo PurchaseOfPPE for canonical cash capex when available", async () => {
            const payload = structuredClone(timeseriesPayload);
            payload.timeseries.result.push(
              series("annualPurchaseOfPPE", [annual("2024-12-31", -20_000), annual("2025-12-31", -21_000)]),
              series("trailingPurchaseOfPPE", [trailing(-22_000)]),
            );
            vi.stubGlobal("fetch", vi.fn(async (input: string | URL | Request) => new Response(JSON.stringify(
              String(input).includes("fundamentals-timeseries") ? payload : metadataPayload
            ), { status: 200, headers: { "Content-Type": "application/json" } })));
            const result = await fetchYahooFundamentalsResult(company);
            expect(result.ok).toBe(true);
            if (!result.ok) return;
            expect(result.data.annualPeriods?.at(-1)?.capitalExpenditures).toBe(21_000);
            expect(result.data.trailingTwelveMonths?.capitalExpenditures).toBe(22_000);
            expect(result.data.annualPeriods?.at(-1)?.provenance?.capitalExpenditures?.concept).toBe("annualPurchaseOfPPE");
          });'''
          new = '''  it("prefers Yahoo CapitalExpenditure over narrower PurchaseOfPPE when both are available", async () => {
            const payload = structuredClone(timeseriesPayload);
            payload.timeseries.result.push(
              series("annualPurchaseOfPPE", [annual("2024-12-31", -20_000), annual("2025-12-31", -21_000)]),
              series("trailingPurchaseOfPPE", [trailing(-22_000)]),
            );
            vi.stubGlobal("fetch", vi.fn(async (input: string | URL | Request) => new Response(JSON.stringify(
              String(input).includes("fundamentals-timeseries") ? payload : metadataPayload
            ), { status: 200, headers: { "Content-Type": "application/json" } })));
            const result = await fetchYahooFundamentalsResult(company);
            expect(result.ok).toBe(true);
            if (!result.ok) return;
            expect(result.data.annualPeriods?.at(-1)?.capitalExpenditures).toBe(26_130);
            expect(result.data.trailingTwelveMonths?.capitalExpenditures).toBe(26_551);
            expect(result.data.annualPeriods?.at(-1)?.provenance?.capitalExpenditures?.concept).toBe("annualCapitalExpenditure");
          });'''
          if old not in text:
              raise SystemExit('stale capex test marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-update-capex-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/data/yahoo-fundamentals.test.ts .github/workflows/one-shot-update-capex-test.yml
          git commit -m "test: align Yahoo capex regression with reconciled semantics"
          git push origin HEAD:fix/coverage-engine-root-cause
