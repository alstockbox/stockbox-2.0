name: StockBox 3 Watchlist V3 Once

on:
  push:
    branches:
      - stockbox-3.0
    paths:
      - .github/workflows/stockbox-3-watchlist-v3-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stockbox-3.0
          fetch-depth: 0
      - name: Apply exact Watchlist V3 patch
        run: python scripts/patch-watchlist-v3-once.py
      - name: Verify patch
        run: |
          git diff --check
          git diff -- src/lib/workspace/actions.ts src/app/watchlist/page.tsx
      - name: Commit Watchlist V3 patch
        run: |
          git config user.name "stockbox-ci"
          git config user.email "stockbox-ci@users.noreply.github.com"
          git add src/lib/workspace/actions.ts src/app/watchlist/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(watchlist): add dark-launched V3 objective alerts"
          git push origin HEAD:stockbox-3.0
