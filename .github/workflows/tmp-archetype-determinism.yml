name: Temporary archetype determinism fix

on:
  push:
    branches:
      - fix/archetype-diagnostic-time-determinism-20260909

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic analysis date to the two valuation diagnostics tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/analysis/archetypes.test.ts')
          text = path.read_text()
          names = [
              'diagnoses valuation multiple gaps by failed input condition',
              'diagnoses FCF yield by missing simple free-cash-flow inputs',
          ]
          insertion = '      analysisDate: "2026-08-25T00:00:00.000Z",\n'

          for name in names:
              start = text.index(f'  it("{name}"')
              next_test = text.find('\n  it("', start + 1)
              end = next_test if next_test != -1 else len(text)
              segment = text[start:end]
              marker = '      annualPeriods,\n'
              if segment.count(marker) != 1:
                  raise SystemExit(f'expected one annualPeriods marker in {name!r}, found {segment.count(marker)}')
              if insertion in segment:
                  raise SystemExit(f'analysisDate already present in {name!r}')
              segment = segment.replace(marker, marker + insertion, 1)
              text = text[:start] + segment + text[end:]

          path.write_text(text)
          PY
          git diff --check
          git diff -- tests/analysis/archetypes.test.ts
      - name: Install dependencies
        run: npm ci
      - name: Archetype diagnostics must fully resolve
        run: npm test -- tests/analysis/archetypes.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit clean test-only fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-archetype-determinism.yml
          git add tests/analysis/archetypes.test.ts
          git diff --cached --check
          git diff --cached --name-only
          expected="$(printf '%s\n' '.github/workflows/tmp-archetype-determinism.yml' 'tests/analysis/archetypes.test.ts')"
          test "$(git diff --cached --name-only)" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: make archetype valuation diagnostics deterministic"
          git push origin HEAD:fix/archetype-diagnostic-time-determinism-20260909
