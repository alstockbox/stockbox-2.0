name: StockBox 2 Upgrade CI

on:
  push:
    branches:
      - upgrade/stockbox-2-ux-portfolio-mobile-20260905
      - fix/etf-investment-company-coverage
  pull_request:
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/lib/**"
      - "scripts/diagnostics/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "vercel.json"
      - ".github/workflows/stockbox-2-upgrade-ci.yml"

jobs:
  main-baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Main branch full test baseline (informational)
        continue-on-error: true
        run: npm test
      - name: Main branch lint baseline (informational)
        continue-on-error: true
        run: npm run lint

  app-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vercel deployment policy test
        run: npm test -- tests/config/vercel-deployment-policy.test.ts
      - name: Portfolio 2 math tests
        run: npm test -- tests/portfolio/portfolio-math-v2.test.ts tests/portfolio/portfolio-final-snapshot-dedupe.test.ts
      - name: Workspace Portfolio 2 regression tests
        run: npm test -- tests/workspace/actions.test.ts tests/workspace/canonical-identity.test.ts
      - name: Analytics regression tests
        run: npm test -- tests/analytics
      - name: Auth regression tests
        run: npm test -- tests/auth
      - name: Full suite excluding known main archetype baseline
        id: full_tests
        continue-on-error: true
        run: npm test -- --exclude tests/analysis/archetypes.test.ts
      - name: Verify archetype baseline or resolved tests
        id: baseline_fingerprint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          NO_COLOR=1 npm test -- tests/analysis/archetypes.test.ts > /tmp/archetypes-baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/archetypes-baseline.log
          if [ "$status" -eq 0 ]; then
            echo "Archetype baseline is fully resolved."
            exit 0
          fi
          grep -Fq "2 failed" /tmp/archetypes-baseline.log
          grep -Fq "50 passed" /tmp/archetypes-baseline.log
          grep -Fq "diagnoses valuation multiple gaps by failed input condition" /tmp/archetypes-baseline.log
          grep -Fq "diagnoses FCF yield by missing simple free-cash-flow inputs" /tmp/archetypes-baseline.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Lint changed StockBox 2 files
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          printf 'Linting changed files:\n%s\n' "${files[*]}"
          npx eslint "${files[@]}"
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Verification gate
        if: always()
        run: |
          test "${{ steps.full_tests.outcome }}" = "success"
          test "${{ steps.baseline_fingerprint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"

  portfolio-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Isolate required migrations
        run: |
          mkdir -p /tmp/stockbox-migrations
          cp supabase/migrations/20260820220000_initial_stockbox.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260905140500_portfolio_2_private_schema.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260905141000_portfolio_2_transactions_snapshots.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260906141500_portfolio_sell_chain_guard.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260907110000_portfolio_cash_flow_accounting.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260907172000_portfolio_snapshot_ledger_revision.sql /tmp/stockbox-migrations/
          cp supabase/migrations/20260908133000_portfolio_final_snapshot_dedupe.sql /tmp/stockbox-migrations/
          rm -f supabase/migrations/*.sql
          supabase init --force
      - name: Start disposable Supabase
        run: supabase start -x vector,edge-runtime,logflare
      - name: Install PostgreSQL client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply base schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260820220000_initial_stockbox.sql
      - name: Apply Portfolio 2 private schema prerequisite
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260905140500_portfolio_2_private_schema.sql
      - name: Apply Portfolio 2 transaction migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260905141000_portfolio_2_transactions_snapshots.sql
      - name: Apply Portfolio 2 sell guard migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260906141500_portfolio_sell_chain_guard.sql
      - name: Apply Portfolio cash-flow accounting migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260907110000_portfolio_cash_flow_accounting.sql
      - name: Apply Portfolio ledger revision migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260907172000_portfolio_snapshot_ledger_revision.sql
      - name: Apply final snapshot dedupe migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/stockbox-migrations/20260908133000_portfolio_final_snapshot_dedupe.sql
      - name: Assert Portfolio 2 invariants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_rls integer;
            v_indexes integer;
          begin
            if to_regnamespace('private') is null then raise exception 'private schema missing'; end if;
            if to_regclass('public.portfolio_transactions') is null then raise exception 'portfolio_transactions missing'; end if;
            if to_regclass('public.portfolio_snapshots') is null then raise exception 'portfolio_snapshots missing'; end if;
            select count(*) into v_rls
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relname in ('portfolio_transactions','portfolio_snapshots') and c.relrowsecurity = true;
            if v_rls <> 2 then raise exception 'RLS must be enabled on both Portfolio 2 tables'; end if;
            select count(*) into v_indexes from pg_indexes
            where schemaname = 'public' and indexname in (
              'portfolio_transactions_portfolio_date_idx',
              'portfolio_transactions_portfolio_ticker_idx',
              'portfolio_snapshots_portfolio_created_idx',
              'portfolio_snapshots_user_created_idx'
            );
            if v_indexes <> 4 then raise exception 'Expected four Portfolio 2 query indexes, found %', v_indexes; end if;
            if to_regprocedure('public.record_portfolio_transaction(uuid,text,text,numeric,numeric,text,date,numeric,numeric,text,text)') is null then raise exception 'record_portfolio_transaction RPC missing'; end if;
            if to_regprocedure('public.update_portfolio_transaction(uuid,numeric,numeric,text,date,numeric)') is null then raise exception 'update_portfolio_transaction RPC missing'; end if;
            if to_regprocedure('public.delete_portfolio_transaction(uuid)') is null then raise exception 'delete_portfolio_transaction RPC missing'; end if;
            if to_regprocedure('public.insert_portfolio_snapshot_if_current(uuid,bigint,jsonb)') is null then raise exception 'snapshot revision RPC missing'; end if;
          end
          $$;
          SQL
      - name: Assert cash-flow performance persistence contract
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_columns integer;
          begin
            select count(*) into v_columns
            from information_schema.columns
            where table_schema = 'public'
              and table_name = 'portfolio_snapshots'
              and column_name in (
                'realized_pl',
                'dividend_income',
                'standalone_fees',
                'trading_fees',
                'total_fees',
                'total_pl'
              );
            if v_columns <> 6 then
              raise exception 'Expected six portfolio performance snapshot columns, found %', v_columns;
            end if;
          end
          $$;
          SQL
      - name: Reuse repeated final snapshots without changing active snapshot behavior
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local session_replication_role = replica;
          insert into public.profiles (id, email)
          values ('00000000-0000-4000-8000-000000000921', 'portfolio-final-dedupe@test.invalid');
          insert into public.portfolios (id, user_id, name, base_currency)
          values ('00000000-0000-4000-8000-000000000922', '00000000-0000-4000-8000-000000000921', 'Final dedupe', 'SEK');
          set local session_replication_role = origin;

          set local role authenticated;
          select set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000000921', true);

          do $$
          declare
            v_first uuid;
            v_second uuid;
            v_active_first uuid;
            v_active_second uuid;
            v_closed_count integer;
            v_active_count integer;
            v_closed jsonb := '{"base_currency":"SEK","portfolio_value":0,"invested_capital":0,"unrealized_pl":0,"unrealized_pl_percent":null,"realized_pl":125,"dividend_income":25,"standalone_fees":5,"trading_fees":10,"total_fees":15,"total_pl":145,"holdings":[],"failures":[],"analysis_summary":{"methodology":"closed-ledger-v1"},"prices_updated_at":null,"analyses_updated_at":null}'::jsonb;
            v_active jsonb := '{"base_currency":"SEK","portfolio_value":100,"invested_capital":90,"unrealized_pl":10,"unrealized_pl_percent":11.11,"realized_pl":0,"dividend_income":0,"standalone_fees":0,"trading_fees":0,"total_fees":0,"total_pl":10,"holdings":[{"ticker":"AAPL"}],"failures":[],"analysis_summary":{"methodology":"market-value-weighted-v1"},"prices_updated_at":null,"analyses_updated_at":null}'::jsonb;
          begin
            select id into v_first
            from public.insert_portfolio_snapshot_if_current(
              '00000000-0000-4000-8000-000000000922', 0, v_closed
            );
            select id into v_second
            from public.insert_portfolio_snapshot_if_current(
              '00000000-0000-4000-8000-000000000922', 0, v_closed
            );

            if v_first is null or v_first is distinct from v_second then
              raise exception 'Repeated final snapshot did not reuse the existing row';
            end if;

            select count(*) into v_closed_count
            from public.portfolio_snapshots
            where portfolio_id = '00000000-0000-4000-8000-000000000922'
              and ledger_revision = 0
              and jsonb_array_length(holdings) = 0;
            if v_closed_count <> 1 then
              raise exception 'Expected one closed snapshot, found %', v_closed_count;
            end if;

            select id into v_active_first
            from public.insert_portfolio_snapshot_if_current(
              '00000000-0000-4000-8000-000000000922', 0, v_active
            );
            select id into v_active_second
            from public.insert_portfolio_snapshot_if_current(
              '00000000-0000-4000-8000-000000000922', 0, v_active
            );

            if v_active_first is null or v_active_second is null or v_active_first = v_active_second then
              raise exception 'Active snapshot behavior was unexpectedly deduplicated';
            end if;

            select count(*) into v_active_count
            from public.portfolio_snapshots
            where portfolio_id = '00000000-0000-4000-8000-000000000922'
              and ledger_revision = 0
              and jsonb_array_length(holdings) > 0;
            if v_active_count <> 2 then
              raise exception 'Expected two active snapshots, found %', v_active_count;
            end if;
          end
          $$;
          rollback;
          SQL
      - name: Reject negative cash-flow amounts
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set session_replication_role = replica;
          insert into public.profiles (id, email)
          values ('00000000-0000-4000-8000-000000000911', 'portfolio-cash-guard@test.invalid');
          insert into public.portfolios (id, user_id, name, base_currency)
          values ('00000000-0000-4000-8000-000000000912', '00000000-0000-4000-8000-000000000911', 'Cash guard', 'USD');
          set session_replication_role = origin;

          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub', '00000000-0000-4000-8000-000000000911', true);
          do $$
          declare
            v_guarded boolean := false;
          begin
            begin
              perform public.record_portfolio_transaction(
                '00000000-0000-4000-8000-000000000912',
                'AAPL', 'dividend', null, null, 'USD', '2026-09-06', 0, -1, null, null
              );
            exception when others then
              if sqlerrm = 'Cash amount must be nonnegative' then
                v_guarded := true;
              else
                raise;
              end if;
            end;
            if not v_guarded then
              raise exception 'Negative cash-flow amount guard did not fire';
            end if;
          end
          $$;
          rollback;

          delete from public.portfolios where id = '00000000-0000-4000-8000-000000000912';
          delete from public.profiles where id = '00000000-0000-4000-8000-000000000911';
          SQL
      - name: Reject sell chains without owned quantity
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set session_replication_role = replica;
          insert into public.profiles (id, email)
          values ('00000000-0000-4000-8000-000000000901', 'portfolio-sell-guard@test.invalid');
          insert into public.portfolios (id, user_id, name, base_currency)
          values ('00000000-0000-4000-8000-000000000902', '00000000-0000-4000-8000-000000000901', 'Sell guard', 'USD');
          insert into public.portfolio_transactions (
            id, portfolio_id, ticker, transaction_type, quantity, price, fees, currency, executed_at
          ) values (
            '00000000-0000-4000-8000-000000000903',
            '00000000-0000-4000-8000-000000000902',
            'AAPL', 'sell', 1, 100, 0, 'USD', '2026-09-01'
          );
          set session_replication_role = origin;

          do $$
          declare
            v_guarded boolean := false;
          begin
            begin
              perform private.rebuild_portfolio_holding(
                '00000000-0000-4000-8000-000000000902', 'AAPL', 'USD'
              );
            exception when others then
              if sqlerrm = 'Sell quantity exceeds owned quantity' then
                v_guarded := true;
              else
                raise;
              end if;
            end;
            if not v_guarded then
              raise exception 'Sell-without-position guard did not fire';
            end if;
          end
          $$;

          delete from public.portfolio_transactions where portfolio_id = '00000000-0000-4000-8000-000000000902';
          delete from public.portfolios where id = '00000000-0000-4000-8000-000000000902';
          delete from public.profiles where id = '00000000-0000-4000-8000-000000000901';
          SQL
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
