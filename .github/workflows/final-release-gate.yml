name: Final StockBox production release gate

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  final-release-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify production migration alignment
        run: |
          test -f supabase/migrations/20260831215457_add_defensive_investment_profile.sql
          grep -q "'defensive'" supabase/migrations/20260831215457_add_defensive_investment_profile.sql

      - name: Install dependencies
        run: npm ci

      - name: Synchronize final implementation report
        run: |
          python scripts/apply-final-report-p1.py
          grep -q 'ecb-fx-v1' docs/STOCKBOX_FINAL_IMPLEMENTATION_REPORT.md
          grep -q 'bounded transient provider retries' docs/STOCKBOX_FINAL_IMPLEMENTATION_REPORT.md
          ! grep -q 'Add authoritative FX normalization for multi-currency comparisons' docs/STOCKBOX_FINAL_IMPLEMENTATION_REPORT.md

      - name: Align legacy regression contracts with bounded retry policy
        run: python scripts/apply-retry-regression-tests.py

      - name: Targeted ECB FX regression
        run: npm test -- tests/data/ecb-fx-p1.test.ts

      - name: Targeted provider retry regression
        run: npm test -- tests/data/provider-retry-p1.test.ts

      - name: Targeted legacy fundamentals and market routing regressions
        run: npm test -- tests/data/global-fundamentals-provider.test.ts tests/env/market-provider-routing.test.ts

      - name: Targeted observability regression
        run: npm test -- tests/analytics/analysis-observability-p1.test.ts

      - name: Full regression suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Remove temporary release machinery
        run: |
          rm -f .github/workflows/final-release-gate.yml
          rm -f scripts/apply-fx-p1.py
          rm -f scripts/apply-provider-retry-p1.py
          rm -f scripts/apply-final-report-p1.py
          rm -f scripts/apply-retry-regression-tests.py

      - name: Verify temporary release machinery is clean
        run: |
          leftovers=$(find .github/workflows -maxdepth 1 -type f \( -name 'p0-*.yml' -o -name 'p1-*.yml' -o -name 'final-release-gate.yml' \) -print 2>/dev/null || true)
          patches=$(find scripts -maxdepth 1 -type f \( -name 'apply-*-p0.py' -o -name 'apply-*-p1.py' -o -name 'apply-retry-regression-tests.py' \) -print 2>/dev/null || true)
          if [ -n "$leftovers" ] || [ -n "$patches" ]; then
            echo "Unexpected temporary release machinery remains:"
            printf '%s\n%s\n' "$leftovers" "$patches"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Live public market-provider smoke
        run: npm run market-data:smoke

      - name: Live ECB FX source smoke
        run: |
          curl --fail --silent --show-error --location \
            --user-agent 'StockBox release smoke/1.0' \
            https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.xml \
            -o /tmp/ecb-fx.xml
          grep -Eq "currency=['\"]USD['\"]" /tmp/ecb-fx.xml
          grep -Eq "currency=['\"]SEK['\"]" /tmp/ecb-fx.xml

      - name: Start production server
        run: |
          npm start -- -p 3001 > /tmp/stockbox-final-runtime.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stockbox-final-runtime.log
          exit 1

      - name: Production runtime release smoke
        env:
          STOCKBOX_SMOKE_BASE_URL: http://127.0.0.1:3001
        run: npm run release:smoke:local

      - name: Show runtime log
        if: always()
        run: cat /tmp/stockbox-final-runtime.log || true

      - name: Commit final report and cleanup
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize release report and cleanup"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
