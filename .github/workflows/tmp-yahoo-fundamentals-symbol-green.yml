name: Temporary Yahoo fundamentals symbol GREEN

on:
  push:
    branches:
      - fix/etf-investment-company-coverage

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Yahoo fundamentals provider symbol identity guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/data/yahoo-fundamentals.ts')
          text = path.read_text()
          old = '''  const response = await fetchJson(url);\n  if (!response.ok) return response;\n  const values = parseSeries(response.data);\n'''
          new = '''  const response = await fetchJson(url);\n  if (!response.ok) return response;\n  const timeseries = object(response.data.timeseries);\n  const results = Array.isArray(timeseries?.result) ? timeseries.result : [];\n  const observedSymbols = results\n    .map((entry) => object(object(entry)?.meta)?.symbol)\n    .flatMap((value) => Array.isArray(value) ? value : value === undefined || value === null ? [] : [value])\n    .map(stringValue)\n    .filter((value): value is string => Boolean(value));\n  if (observedSymbols.some((observedSymbol) => !yahooSymbolsEquivalent(symbol, observedSymbol))) {\n    return failure(\"invalid_row\", \"Yahoo Finance fundamentals symbol identity does not match the requested security.\");\n  }\n  const values = parseSeries(response.data);\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one fetchTimeseries response block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted Yahoo fundamentals identity regression
        run: npm test -- tests/data/yahoo-fundamentals-provider-identity.test.ts tests/data/yahoo-fundamentals.test.ts
      - name: Typecheck Yahoo symbol guard
        run: npm run typecheck
      - name: Commit source fix and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/yahoo-fundamentals.ts
          git rm .github/workflows/tmp-yahoo-fundamentals-symbol-green.yml
          git commit -m "fix: validate Yahoo fundamentals symbol identity"
          git push origin HEAD:fix/etf-investment-company-coverage
