name: Temporary portfolio current revision UI patch

on:
  push:
    branches:
      - fix/portfolio-snapshot-current-revision-ui-20260907
    paths:
      - .github/workflows/tmp-portfolio-current-revision-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-snapshot-current-revision-ui-20260907
      - name: Apply bounded page patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/portfolio/page.tsx')
          text = path.read_text()

          replacements = [
            (
              '  diversification_score: Numeric;\n  holdings: SnapshotHolding[] | null;',
              '  diversification_score: Numeric;\n  ledger_revision: Numeric;\n  holdings: SnapshotHolding[] | null;',
            ),
            (
              '  const transactionsAvailable = !transactionResult.error;\n  const transactions = (transactionResult.data ?? []) as TransactionRow[];\n\n  const tickers =',
              '  const transactionsAvailable = !transactionResult.error;\n  const transactions = (transactionResult.data ?? []) as TransactionRow[];\n\n  const revisionResult = supabase && ids.length\n    ? await supabase.from("portfolio_ledger_revisions").select("portfolio_id,revision").in("portfolio_id", ids)\n    : { data: [], error: null };\n  const revisionsAvailable = !revisionResult.error;\n  const currentLedgerRevision = new Map<string, number>();\n  for (const row of (revisionResult.data ?? []) as Array<{ portfolio_id: string; revision: Numeric }>) {\n    const revision = numeric(row.revision);\n    if (revision !== null && Number.isSafeInteger(revision) && revision >= 0) currentLedgerRevision.set(row.portfolio_id, revision);\n  }\n\n  const tickers =',
            ),
            (
              'diversification_score,holdings,failures,analysis_summary,prices_updated_at,analyses_updated_at,created_at")',
              'diversification_score,ledger_revision,holdings,failures,analysis_summary,prices_updated_at,analyses_updated_at,created_at")',
            ),
            (
              '  const snapshotsAvailable = !snapshotResult.error;\n  const snapshots = (snapshotResult.data ?? []) as SnapshotRow[];\n  const latestSnapshot = new Map<string, SnapshotRow>();\n  for (const snapshot of snapshots) if (!latestSnapshot.has(snapshot.portfolio_id)) latestSnapshot.set(snapshot.portfolio_id, snapshot);',
              '  const snapshotsAvailable = !snapshotResult.error && revisionsAvailable;\n  const snapshots = (snapshotResult.data ?? []) as SnapshotRow[];\n  const latestSnapshot = new Map<string, SnapshotRow>();\n  for (const snapshot of snapshots) {\n    const currentRevision = currentLedgerRevision.get(snapshot.portfolio_id);\n    const snapshotRevision = numeric(snapshot.ledger_revision);\n    if (snapshotRevision === currentRevision && !latestSnapshot.has(snapshot.portfolio_id)) latestSnapshot.set(snapshot.portfolio_id, snapshot);\n  }',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit bounded change and self-remove
        run: |
          git config user.name "stockbox-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-portfolio-current-revision-ui.yml
          git add src/app/portfolio/page.tsx
          git diff --cached --check
          git commit -m "Invalidate stale current portfolio snapshots"
          git push origin HEAD:fix/portfolio-snapshot-current-revision-ui-20260907
