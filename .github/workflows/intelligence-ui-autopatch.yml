name: One-time Opportunity UI Integration

on:
  push:
    branches:
      - work/intelligence-engine-v3
    paths:
      - .github/workflows/intelligence-ui-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/intelligence-engine-v3
      - name: Insert opportunity intelligence panel
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/analysis/report-view.tsx")
          text = path.read_text()

          import_anchor = 'import { AnalysisLensControl } from "./analysis-lens-control";\n'
          import_line = 'import { OpportunityIntelligencePanel } from "./opportunity-intelligence-panel";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          placement_anchor = '      {mode === "simple" && report.historical ? <HistoricalResearchView report={report} mode={mode} locale={locale} /> : null}\n\n      <WhatChanged'
          panel = '      <OpportunityIntelligencePanel report={report} mode={mode} locale={locale} />\n\n'
          if panel not in text:
              if placement_anchor not in text:
                  raise SystemExit("placement anchor missing")
              text = text.replace(placement_anchor, '      {mode === "simple" && report.historical ? <HistoricalResearchView report={report} mode={mode} locale={locale} /> : null}\n\n' + panel + '      <WhatChanged', 1)

          path.write_text(text)
      - name: Verify narrow diff
        run: |
          git diff --check
          git diff -- src/components/analysis/report-view.tsx
          test "$(git diff --name-only | wc -l)" -eq 1
      - name: Commit integration
        run: |
          git config user.name "stockbox-ci"
          git config user.email "stockbox-ci@users.noreply.github.com"
          git add src/components/analysis/report-view.tsx
          git commit -m "feat: integrate opportunity intelligence panel"
          git push origin HEAD:work/intelligence-engine-v3
