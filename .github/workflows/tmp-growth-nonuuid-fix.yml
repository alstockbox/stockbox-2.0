name: Temporary growth non-UUID hotfix

on:
  push:
    branches:
      - fix/growth-v3-nonuuid-attribution-main-20260909
    paths:
      - ".github/workflows/tmp-growth-nonuuid-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal UUID attribution guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/stockbox-growth-engine/v3/orchestration.ts')
          text = path.read_text()

          old_helper = '''function visitorIdentity(event: any) {
            return event.user_id || event.anonymous_id || event.session_id || event.id || null;
          }

          export async function aggregateAttributedGrowth'''.replace('          ', '')
          new_helper = '''function visitorIdentity(event: any) {
            return event.user_id || event.anonymous_id || event.session_id || event.id || null;
          }

          function isUuid(value: string) {
            return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
          }

          export async function aggregateAttributedGrowth'''.replace('          ', '')
          if text.count(old_helper) != 1:
              raise SystemExit(f'helper anchor count={text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_guard = '    if (!contentId || !identity) continue;'
          new_guard = '    if (!isUuid(contentId) || !identity) continue;'
          if text.count(old_guard) != 1:
              raise SystemExit(f'guard anchor count={text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)
          path.write_text(text)
          PY
      - name: Targeted regression
        run: npm test -- tests/growth-v3-orchestration.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit clean source fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-growth-nonuuid-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/stockbox-growth-engine/v3/orchestration.ts
          git diff --cached --check
          git commit -m "fix: reject non-UUID growth attribution ids"
          git push origin HEAD:fix/growth-v3-nonuuid-attribution-main-20260909
