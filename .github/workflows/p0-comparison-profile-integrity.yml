name: P0 comparison profile integrity

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded comparison profile page P0 patch
        run: python3 scripts/apply-comparison-profile-page-p0.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted comparison tests
        run: npx vitest run tests/analysis/comparison.test.ts tests/analysis/comparison-page.test.ts tests/analysis/comparison-profile-integrity-p0.test.ts tests/analysis/comparison-profile-page-p0.test.ts
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary comparison patch machinery
        run: rm -f scripts/apply-comparison-profile-page-p0.py .github/workflows/p0-comparison-profile-integrity.yml
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified comparison profile integrity
        run: |
          git config user.name "alstockbox"
          git config user.email "alwatchbox@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire profile-aware comparison experience"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
