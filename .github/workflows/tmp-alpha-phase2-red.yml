name: Temporary Alpha Phase 2 RED

on:
  push:
    branches:
      - feat/alpha-persistence-scanner-forward-port-20260910

permissions:
  contents: read

jobs:
  alpha-phase2-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Phase 2 contracts
        run: npm test -- tests/analysis/alpha-scan-policy.test.ts tests/analysis/alpha-universe.test.ts tests/db/alpha-persistence-migrations.test.ts tests/analysis/alpha-scanner-boundary.test.ts
