name: Temporary licensed estimates verification

on:
  push:
    branches:
      - feat/licensed-estimates-forward-port-20260909

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Licensed estimates regressions
        run: npx vitest run tests/data/twelve-data-estimates.test.ts tests/data/estimate-report-augment.test.ts tests/data/enhanced-provider-estimates.test.ts tests/env/estimates-provider.test.ts
      - name: Repository lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full blocker suite excluding archetypes
        run: npm test -- --exclude tests/analysis/archetypes.test.ts
      - name: Fully resolved archetype suite
        run: npm test -- tests/analysis/archetypes.test.ts
      - name: Production build
        run: npm run build
