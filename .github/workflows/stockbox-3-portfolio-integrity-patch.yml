name: StockBox 3 Portfolio Integrity Patch

on:
  push:
    branches:
      - stockbox-3.0
    paths:
      - .github/workflows/stockbox-3-portfolio-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stockbox-3.0
          fetch-depth: 0
      - name: Apply exact snapshot persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/api/portfolio/snapshot/route.ts")
          text = path.read_text()

          old_import = 'import { createClient } from "@/lib/supabase/server";'
          new_import = 'import { createAdminClient } from "@/lib/supabase/admin";\nimport { createClient } from "@/lib/supabase/server";'
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one server-client import, found {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_write = '  const { data: snapshot, error: snapshotError } = await supabase.from("portfolio_snapshots").insert({'
          new_write = '  const snapshotStore = createAdminClient();\n  if (!snapshotStore) return Response.json({ error: "Portfolio snapshot storage is unavailable." }, { status: 503 });\n\n  const { data: snapshot, error: snapshotError } = await snapshotStore.from("portfolio_snapshots").insert({'
          if text.count(old_write) != 1:
              raise SystemExit(f"expected one snapshot write anchor, found {text.count(old_write)}")
          text = text.replace(old_write, new_write, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/app/api/portfolio/snapshot/route.ts
      - name: Commit route patch
        shell: bash
        run: |
          git config user.name "stockbox-ci"
          git config user.email "stockbox-ci@users.noreply.github.com"
          git add src/app/api/portfolio/snapshot/route.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(portfolio): persist snapshots through trusted server client"
          git push origin HEAD:stockbox-3.0
