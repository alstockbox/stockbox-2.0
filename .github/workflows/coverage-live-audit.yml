name: StockBox Live Coverage Audit

on:
  push:
    branches:
      - fix/coverage-engine-root-cause
    paths:
      - ".github/workflows/coverage-live-audit.yml"
      - "tests/diagnostics/live-coverage-batch.test.ts"
      - "tests/diagnostics/live-reit-specialized.test.ts"
      - "tests/diagnostics/live-sec-yahoo-period-fingerprint.test.ts"
      - "tests/data/adr-listing-basis.test.ts"
      - "src/lib/data/coverage-audit*.ts"
      - "src/lib/analysis/coverage-audit.ts"
      - "src/lib/data/company-search.ts"
      - "src/lib/data/company-search-core.ts"
      - "src/lib/data/security-classification.ts"
      - "src/lib/data/provider.ts"
      - "src/lib/data/provider-core.ts"
      - "src/lib/data/sec.ts"
      - "src/lib/data/sec-core.ts"
      - "src/lib/data/sec-reit-specialized*.ts"
      - "src/lib/data/specialized-enrichment.ts"
      - "src/lib/data/yahoo-fundamentals.ts"
      - "src/lib/data/yahoo-fundamentals-core.ts"

permissions:
  contents: read

jobs:
  live-coverage-100:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stratified live coverage audit
        env:
          RUN_LIVE_COVERAGE: "1"
          SEC_USER_AGENT: "StockBox/1.0 https://www.getstockbox.app/contact"
        run: npx vitest run tests/diagnostics/live-coverage-batch.test.ts tests/diagnostics/live-reit-specialized.test.ts tests/diagnostics/live-sec-yahoo-period-fingerprint.test.ts --reporter=verbose

      - name: Upload coverage diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-live-100
          path: artifacts/coverage-live/coverage-live-100.json
          if-no-files-found: warn
          retention-days: 7