name: One-shot Yahoo diluted-share supplement

on:
  push:
    branches:
      - fix/coverage-engine-root-cause

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coverage-engine-root-cause
          fetch-depth: 0
      - name: Patch exact-date diluted-share supplement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/data/yahoo-fundamentals-core.ts')
          text = path.read_text()

          marker = '  if (capexFact) metricProvenance.capitalExpenditures = provenance(capexFact);'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one capex marker, found {text.count(marker)}')
          block = "\n".join([
              marker,
              '  const directDilutedSharesFact = atDate(values, `${flowPrefix}DilutedAverageShares`, flowDate);',
              '  const dilutedSharesFact = directDilutedSharesFact',
              '    ?? (flowPrefix === "annual" ? atDate(values, "trailingDilutedAverageShares", flowDate) : null);',
              '  if (dilutedSharesFact) metricProvenance.sharesDiluted = provenance(dilutedSharesFact);',
          ])
          text = text.replace(marker, block, 1)

          old = '    sharesDiluted: flow("DilutedAverageShares", "sharesDiluted"),'
          new = '    sharesDiluted: dilutedSharesFact?.value ?? null,'
          if text.count(old) != 1:
              raise SystemExit(f'expected one sharesDiluted marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-yahoo-diluted-share-supplement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/yahoo-fundamentals-core.ts .github/workflows/one-shot-yahoo-diluted-share-supplement.yml
          git commit -m "fix: supplement annual diluted shares from exact-date Yahoo TTM"
          git push origin HEAD:fix/coverage-engine-root-cause
