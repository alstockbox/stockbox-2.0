name: Temporary Portfolio closed performance RED

on:
  push:
    branches:
      - fix/portfolio-closed-performance-summary-20260907

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify focused RED test
        run: npm test -- tests/portfolio/portfolio-closed-performance-summary.test.ts
