name: P0 Market provider smoke

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  smoke-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Probe configured market provider chain
        run: npm run market-data:smoke
      - name: Remove temporary provider smoke workflow
        if: success()
        run: rm -f .github/workflows/p0-market-provider-smoke.yml
      - name: Commit workflow cleanup
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary provider smoke workflow"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
