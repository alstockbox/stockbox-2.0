name: Temporary Portfolio closed performance GREEN

on:
  push:
    branches:
      - fix/portfolio-closed-performance-summary-20260907

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-closed-performance-summary-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply minimal GREEN patch
        run: python .github/tmp-closed-performance-green.py
      - run: npm ci
      - name: Verify focused GREEN test
        run: npm test -- tests/portfolio/portfolio-closed-performance-summary.test.ts
      - name: Commit GREEN patch and remove temporary helpers
        run: |
          rm .github/tmp-closed-performance-green.py
          rm .github/workflows/tmp-portfolio-closed-performance-red.yml
          rm .github/workflows/tmp-portfolio-closed-performance-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/portfolio/page.tsx .github/tmp-closed-performance-green.py .github/workflows/tmp-portfolio-closed-performance-red.yml .github/workflows/tmp-portfolio-closed-performance-green.yml
          git commit -m "fix(portfolio): keep closed performance summary visible"
          git push origin HEAD:fix/portfolio-closed-performance-summary-20260907
