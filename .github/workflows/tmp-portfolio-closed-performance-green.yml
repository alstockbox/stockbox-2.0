                        ) : null}

                        {latest ? (
'''

          if page.count(old) != 1:
              raise SystemExit(f'expected one financial summary block, found {page.count(old)}')
          page = page.replace(old, new, 1)
          path.write_text(page)
          PY
      - run: npm ci
      - name: Verify focused GREEN test
        run: npm test -- tests/portfolio/portfolio-closed-performance-summary.test.ts
      - name: Commit GREEN patch and remove temporary workflows
        run: |
          rm .github/workflows/tmp-portfolio-closed-performance-red.yml
          rm .github/workflows/tmp-portfolio-closed-performance-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/portfolio/page.tsx .github/workflows/tmp-portfolio-closed-performance-red.yml .github/workflows/tmp-portfolio-closed-performance-green.yml
          git commit -m "fix(portfolio): keep closed performance summary visible"
          git push origin HEAD:fix/portfolio-closed-performance-summary-20260907
