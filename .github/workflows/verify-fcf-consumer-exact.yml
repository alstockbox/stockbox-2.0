name: Verify exact FCF consumer commit

on:
  push:
    branches:
      - fix/coverage-engine-root-cause
    paths:
      - .github/workflows/verify-fcf-consumer-exact.yml

permissions:
  contents: read

jobs:
  verify-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b29dfb1f0379b25ea9a5da63c5f0e282de9a4fc8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "b29dfb1f0379b25ea9a5da63c5f0e282de9a4fc8"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
