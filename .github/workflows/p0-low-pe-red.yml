name: P0 low PE integration red

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: read

jobs:
  red-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run low PE integration and export tests
        run: npx vitest run tests/analysis/historical-discount-quality-integration.test.ts tests/analysis/historical-discount-quality-export.test.ts
