name: P0 low PE historical discount quality patch

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded low PE P0 patch
        run: |
          set +e
          node scripts/release/apply-low-pe-p0-v2.mjs > /tmp/low-pe-patch.log 2>&1
          status=$?
          set -e
          cat /tmp/low-pe-patch.log
          if [ "$status" -eq 0 ]; then
            echo "Expected v2 to stop at the isolated export guard, but it completed unexpectedly."
            exit 1
          fi
          grep -Fq "export: append discount quality section: expected exactly one match, found 0" /tmp/low-pe-patch.log
          grep -Fq "discountQuality: evaluateHistoricalDiscountQuality({" src/lib/analysis/engine.ts
          grep -Fq "Historical Discount Quality" src/components/analysis/historical-research.tsx
          grep -Fq "discountQuality?: HistoricalDiscountQuality;" src/lib/analysis/types.ts
          node scripts/release/apply-low-pe-export-p0.mjs
      - name: Install dependencies
        run: npm ci
      - name: Targeted low PE tests
        run: npx vitest run tests/analysis/historical-discount-quality-p0.test.ts tests/analysis/historical-discount-quality-integration.test.ts tests/analysis/historical-discount-quality-export.test.ts
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified low PE implementation
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          rm -f scripts/release/apply-low-pe-p0.mjs
          rm -f scripts/release/apply-low-pe-p0-v2.mjs
          rm -f scripts/release/apply-low-pe-export-p0.mjs
          rm -f .github/workflows/p0-low-pe-red.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "Implement historical discount quality P0"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
