name: Patch batch quota race

on:
  push:
    branches:
      - fix/batch-quota-persist-race-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-quota-persist-race-20260908
      - name: Patch quota settlement ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/batch/durable.ts')
          text = path.read_text()
          old = '''    await assertBatchItemLease(item.id, itemAttempt, startedAt, signal);\n    const analysisId = persisted.id;\n    if (reservationId) {\n      if ("replayed" in persisted && persisted.replayed) {\n        await releaseAnalysisReservation({ reservationId, status: "released" });\n      } else {\n        await completeAnalysisReservation({ reservationId, analysisId });\n      }\n      reservationId = null;\n    }\n\n    await assertBatchItemLease(item.id, itemAttempt, startedAt, signal);\n'''
          new = '''    const analysisId = persisted.id;\n    if (reservationId) {\n      if ("replayed" in persisted && persisted.replayed) {\n        await releaseAnalysisReservation({ reservationId, status: "released" });\n      } else {\n        await completeAnalysisReservation({ reservationId, analysisId });\n      }\n      reservationId = null;\n    }\n\n    await assertBatchItemLease(item.id, itemAttempt, startedAt, signal);\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          grep -n "const analysisId = persisted.id" src/lib/batch/durable.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/batch/durable.ts
          git commit -m "fix(batch): settle quota before post-persist lease check"
          git push origin HEAD:fix/batch-quota-persist-race-20260908
