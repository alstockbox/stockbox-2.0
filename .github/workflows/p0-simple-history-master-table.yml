name: P0 simple historical master table

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded Simple historical master-table P0 patch
        run: node scripts/release/apply-simple-history-master-table-p0.mjs
      - name: Install dependencies
        run: npm ci
      - name: Targeted Simple historical master-table tests
        run: npx vitest run tests/analysis/simple-history-master-table-p0.test.ts tests/analysis/historical.test.ts tests/analysis/historical-valuation-p0.test.ts
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary patch machinery before static checks
        run: rm scripts/release/apply-simple-history-master-table-p0.mjs .github/workflows/p0-simple-history-master-table.yml
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified Simple historical master table
        run: |
          git config user.name "alstockbox"
          git config user.email "alwatchbox@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "feat: add Simple historical master table"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
