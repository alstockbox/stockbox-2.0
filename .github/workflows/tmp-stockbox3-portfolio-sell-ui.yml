name: StockBox 3 temporary portfolio sell UI patch

on:
  push:
    branches:
      - stockbox-3.0
    paths:
      - .github/workflows/tmp-stockbox3-portfolio-sell-ui.yml
      - scripts/tmp_stockbox3_portfolio_sell_ui_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stockbox-3.0
          fetch-depth: 0
      - name: Apply portfolio sell UI patch
        run: python scripts/tmp_stockbox3_portfolio_sell_ui_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/portfolio/page.tsx
          git commit -m "feat(portfolio): expose sales and realized P/L"
          git push origin HEAD:stockbox-3.0
