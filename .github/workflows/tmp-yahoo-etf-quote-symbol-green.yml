name: Temporary Yahoo ETF quote symbol GREEN

on:
  push:
    branches:
      - fix/etf-investment-company-coverage
    paths:
      - .github/workflows/tmp-yahoo-etf-quote-symbol-green.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify RED source baseline
        run: git diff --exit-code 4d32af78479d69100b089a6845f40729da9053dd -- src/lib/data/yahoo-etf.ts tests/data/yahoo-etf-quote-symbol-identity.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Yahoo ETF quote symbol identity fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/data/yahoo-etf.ts")
          text = path.read_text()
          anchor = "function numberValue(value: unknown): number | null {"
          helper = "\n".join([
              "function yahooSymbolsEquivalent(requested: string, returned: string): boolean {",
              "  const requestedSymbol = requested.trim().toUpperCase();",
              "  const returnedSymbol = returned.trim().toUpperCase();",
              "  if (requestedSymbol === returnedSymbol) return true;",
              "",
              "  const requestedClass = requestedSymbol.match(/^([A-Z0-9]{1,8})[.-]([A-Z])$/);",
              "  const returnedClass = returnedSymbol.match(/^([A-Z0-9]{1,8})[.-]([A-Z])$/);",
              "  return Boolean(",
              "    requestedClass",
              "    && returnedClass",
              "    && requestedClass[1] === returnedClass[1]",
              "    && requestedClass[2] === returnedClass[2],",
              "  );",
              "}",
              "",
          ])
          if text.count(anchor) != 1:
              raise SystemExit(f"helper anchor count={text.count(anchor)}")
          text = text.replace(anchor, helper + anchor, 1)
          old = "\n".join([
              "  const summary = quoteSummaryResult(summaryPayload);",
              "  const quote = quoteResult(quotePayload);",
          ])
          new = "\n".join([
              "  const summary = quoteSummaryResult(summaryPayload);",
              "  const rawQuote = quoteResult(quotePayload);",
              "  const observedQuoteSymbol = stringValue(rawQuote?.symbol);",
              "  const quote = rawQuote && (!observedQuoteSymbol || yahooSymbolsEquivalent(symbol, observedQuoteSymbol))",
              "    ? rawQuote",
              "    : null;",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"quote anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted Yahoo ETF quote regressions
        run: npm test -- tests/data/yahoo-etf-quote-symbol-identity.test.ts tests/data/etf-provider-chain.test.ts tests/data/yahoo-etf-holding-fundamentals.test.ts tests/data/yahoo-etf-holding-fundamentals-symbol-identity.test.ts
      - name: Typecheck Yahoo ETF quote fix
        run: npm run typecheck
      - name: Commit source fix and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/yahoo-etf.ts
          git rm .github/workflows/tmp-yahoo-etf-quote-symbol-green.yml
          git commit -m "fix: verify Yahoo ETF quote symbol identity"
          git push origin HEAD:fix/etf-investment-company-coverage
