name: P1 resilience red-green

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  targeted-resilience:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply provider retry integration patch
        run: python scripts/apply-provider-retry-p1.py
      - name: Targeted FX regression
        run: npm test -- tests/data/ecb-fx-p1.test.ts
      - name: Provider retry GREEN test
        run: npm test -- tests/data/provider-retry-p1.test.ts
      - name: Typecheck resilience integration
        run: npm run typecheck
      - name: Commit provider retry integration
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data/provider.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: retry transient provider failures once"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
