name: P1 FX red-green

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  targeted-fx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply FX integration patch
        run: python scripts/apply-fx-p1.py
      - name: Targeted FX tests
        run: npm test -- tests/data/ecb-fx-p1.test.ts
      - name: Typecheck FX integration
        run: npm run typecheck
      - name: Commit FX integration
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/analysis/comparison.ts src/app/compare/page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: normalize cross-currency comparison with ECB FX"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
