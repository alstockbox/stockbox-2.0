name: P1 resilience red-green

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: read

jobs:
  targeted-resilience:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted FX regression
        run: npm test -- tests/data/ecb-fx-p1.test.ts
      - name: Provider retry RED test
        run: npm test -- tests/data/provider-retry-p1.test.ts
