name: P0 Export release integrity

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted export and chart integrity tests
        run: npx vitest run tests/analysis/financial-data-export.test.ts tests/analysis/historical-discount-quality-export.test.ts tests/analysis/report-export.test.ts tests/analysis/chart-gap-integrity-p0.test.ts tests/analysis/chart-geometry.test.ts
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary release workflow
        run: rm -f .github/workflows/p0-export-release-integrity.yml
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit workflow cleanup
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "chore: remove temporary export integrity workflow"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
