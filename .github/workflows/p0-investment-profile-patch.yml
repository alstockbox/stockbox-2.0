name: P0 investment profile patch

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded P0 patch
        run: node scripts/release/apply-investment-profile-p0.mjs

      - name: Install dependencies
        run: npm ci

      - name: Unit and regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit verified P0 implementation
        shell: bash
        run: |
          rm -f scripts/release/apply-investment-profile-p0.mjs
          rm -f .github/workflows/p0-investment-profile-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "feat: ship defensive investment profile and profile lens"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
