name: Final StockBox release gate

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  final-gate-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout final release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify production migration alignment
        run: |
          test -f supabase/migrations/20260831215457_add_defensive_investment_profile.sql
          test ! -f supabase/migrations/20260831213000_add_defensive_investment_profile.sql
          grep -q "'defensive'" supabase/migrations/20260831215457_add_defensive_investment_profile.sql
      - name: Install dependencies
        run: npm ci
      - name: Targeted observability regression
        run: npm test -- tests/analytics/analysis-observability-p1.test.ts
      - name: Full regression suite
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary final workflow
        run: rm -f .github/workflows/p1-observability-red-green.yml
      - name: Verify temporary release machinery is clean
        run: |
          leftovers=$(find .github/workflows -maxdepth 1 -type f \( -name 'p0-*.yml' -o -name 'p1-*.yml' \) -print 2>/dev/null || true)
          patches=$(find scripts -maxdepth 1 -type f -name 'apply-*-p0.py' -print 2>/dev/null || true)
          if [ -n "$leftovers" ] || [ -n "$patches" ]; then
            echo "Unexpected temporary release machinery remains:"
            printf '%s\n%s\n' "$leftovers" "$patches"
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Live public market-provider smoke
        run: npm run market-data:smoke
      - name: Start production server
        run: |
          npm start -- -p 3001 > /tmp/stockbox-final-runtime.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stockbox-final-runtime.log
          exit 1
      - name: Production runtime release smoke
        env:
          STOCKBOX_SMOKE_BASE_URL: http://127.0.0.1:3001
        run: npm run release:smoke:local
      - name: Show runtime log
        if: always()
        run: cat /tmp/stockbox-final-runtime.log || true
      - name: Commit final workflow cleanup
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove final observability release gate"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
