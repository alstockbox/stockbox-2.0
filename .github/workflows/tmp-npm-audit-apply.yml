name: Temporary npm audit security fix

on:
  push:
    branches:
      - fix/npm-audit-critical-20260909
    paths:
      - ".github/workflows/tmp-npm-audit-apply.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply minimal non-force dependency fix
        run: |
          npm install --package-lock-only --save-exact next@16.3.4
          npm audit fix --package-lock-only
      - name: Install exact candidate tree
        run: npm ci
      - name: Security gates
        shell: bash
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm ls next sharp js-yaml
      - name: Global lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full blocker suite excluding known archetype baseline
        run: npm test -- --exclude tests/analysis/archetypes.test.ts
      - name: Verify archetype baseline or resolved tests
        shell: bash
        run: |
          set +e
          NO_COLOR=1 npm test -- tests/analysis/archetypes.test.ts > /tmp/archetypes-baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/archetypes-baseline.log
          if [ "$status" -eq 0 ]; then
            echo "Archetype baseline is fully resolved."
            exit 0
          fi
          grep -Fq "2 failed" /tmp/archetypes-baseline.log
          grep -Fq "50 passed" /tmp/archetypes-baseline.log
          grep -Fq "diagnoses valuation multiple gaps by failed input condition" /tmp/archetypes-baseline.log
          grep -Fq "diagnoses FCF yield by missing simple free-cash-flow inputs" /tmp/archetypes-baseline.log
      - name: Production build
        run: npm run build
      - name: Commit clean dependency fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-npm-audit-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: update vulnerable Next.js dependency tree"
          git push origin HEAD:fix/npm-audit-critical-20260909
