name: P0 historical coverage integrity

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run historical coverage P0 test
        run: npx vitest run tests/analysis/historical-coverage-integrity-p0.test.ts
