name: One-shot beta lag policy patch

on:
  push:
    branches:
      - fix/coverage-engine-root-cause
    paths:
      - ".github/workflows/one-shot-beta-lag-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact beta lag policy patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/data/yahoo-market-core.ts")
          text = path.read_text()
          old = "const MAX_BETA_LAG_DAYS = 21;"
          new = "const MAX_BETA_LAG_DAYS = 63;"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one beta lag constant, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit product patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-beta-lag-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/yahoo-market-core.ts .github/workflows/one-shot-beta-lag-patch.yml
          git diff --cached --check
          git commit -m "fix: preserve well-sampled beta with short benchmark lag"
          git push origin HEAD:fix/coverage-engine-root-cause
