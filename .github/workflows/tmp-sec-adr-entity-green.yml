name: Temporary SEC ADR issuer entity GREEN

on:
  push:
    branches:
      - fix/etf-investment-company-coverage

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal verified SEC entity identity fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/data/sec.ts')
          text = path.read_text()
          old = '      entityId: identity?.canonicalId ?? company.entityId,\n'
          new = '      entityId: identity?.canonicalId ?? `sec:${cik}`,\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one SEC entityId assignment, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted ADR SEC identity tests
        run: npm test -- tests/data/depositary-receipt-sec-issuer-identity.test.ts
      - name: Commit source fix and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/sec.ts
          git rm .github/workflows/tmp-sec-adr-entity-green.yml
          git commit -m "fix: derive verified SEC issuer identity"
          git push origin HEAD:fix/etf-investment-company-coverage
