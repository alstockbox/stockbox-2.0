name: Apply closed portfolio UI patch

on:
  push:
    branches:
      - portfolio-closed-cashflow-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-closed-cashflow-20260907
          fetch-depth: 0
      - name: Apply surgical Portfolio UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/portfolio/page.tsx")
          source = path.read_text()

          position_anchor = '''                const positions = buildPortfolioPositions(transactionInputs);\n                const latest = latestSnapshot.get(portfolio.id) ?? null;'''
          position_replacement = '''                const positions = buildPortfolioPositions(transactionInputs);\n                const activePositionKeys = new Set(positions.map((position) => `${position.ticker}:${position.currency}`));\n                const closedCashFlowPositions = portfolioTransactions.reduce<Array<{ ticker: string; currency: string }>>((closed, transaction) => {\n                  if (transaction.transaction_type !== "buy") return closed;\n                  const ticker = transaction.ticker.trim().toUpperCase();\n                  const currency = transaction.currency.trim().toUpperCase();\n                  const key = `${ticker}:${currency}`;\n                  if (!ticker || !currency || activePositionKeys.has(key) || closed.some((identity) => `${identity.ticker}:${identity.currency}` === key)) return closed;\n                  closed.push({ ticker, currency });\n                  return closed;\n                }, []);\n                const latest = latestSnapshot.get(portfolio.id) ?? null;'''
          if source.count(position_anchor) != 1:
              raise SystemExit(f"Expected one position anchor, found {source.count(position_anchor)}")
          source = source.replace(position_anchor, position_replacement, 1)

          outer_anchor = '''                    {positions.length ? (\n                      <>\n                        <div className="mt-5 grid grid-cols-2 gap-3 lg:grid-cols-4">'''
          outer_replacement = '''                    {positions.length || portfolioTransactions.length ? (\n                      <>\n                        {positions.length ? (\n                          <>\n                        <div className="mt-5 grid grid-cols-2 gap-3 lg:grid-cols-4">'''
          if source.count(outer_anchor) != 1:
              raise SystemExit(f"Expected one outer positions anchor, found {source.count(outer_anchor)}")
          source = source.replace(outer_anchor, outer_replacement, 1)

          history_anchor = '''                          </div>\n                        </div>\n\n                        <div className="mt-7 border-t border-white/10 pt-6">\n                          <h3 className="font-semibold text-[#f4efe5]">{sv ? "Köp- och transaktionshistorik" : "Purchase and transaction history"}</h3>'''
          history_replacement = '''                          </div>\n                        </div>\n                          </>\n                        ) : (\n                          <div className="mt-6 rounded-xl border border-dashed border-white/15 bg-white/[0.02] p-6 text-center">\n                            <BriefcaseBusiness className="mx-auto h-8 w-8 text-[#e1cb95]" />\n                            <h3 className="mt-3 font-semibold">{sv ? "Inga aktiva positioner" : "No active positions"}</h3>\n                            <p className="mx-auto mt-2 max-w-lg text-sm text-[#8f9bac]">{sv ? "Alla positioner är stängda. Transaktionshistorik, portföljhistorik och kassaflöden finns kvar nedan." : "All positions are closed. Transaction history, portfolio history and cash-flow entries remain available below."}</p>\n                          </div>\n                        )}\n\n                        {closedCashFlowPositions.length ? (\n                          <div className="mt-7 border-t border-white/10 pt-6">\n                            <h3 className="font-semibold text-[#f4efe5]">{sv ? "Stängda positioner" : "Closed positions"}</h3>\n                            <p className="mt-1 text-xs leading-5 text-[#8f9bac]">{sv ? "Utdelningar och värdepappersspecifika avgifter kan fortfarande registreras mot värdepapper som tidigare funnits i portföljen." : "Dividends and security-specific fees can still be recorded against securities previously held in this portfolio."}</p>\n                            <div className="mt-3 grid gap-3 xl:grid-cols-2">\n                              {closedCashFlowPositions.map((identity) => (\n                                <div key={`closed-${identity.ticker}-${identity.currency}`} className="rounded-xl border border-white/10 bg-[#0b1829] p-4">\n                                  <div className="flex items-center justify-between gap-3"><p className="font-mono text-sm font-semibold text-[#e1cb95]">{identity.ticker}</p><span className="text-xs text-[#8f9bac]">{identity.currency}</span></div>\n                                  <PortfolioCashFlowForm portfolioId={portfolio.id} ticker={identity.ticker} currency={identity.currency} today={today} locale={locale} />\n                                </div>\n                              ))}\n                            </div>\n                          </div>\n                        ) : null}\n\n                        <div className="mt-7 border-t border-white/10 pt-6">\n                          <h3 className="font-semibold text-[#f4efe5]">{sv ? "Köp- och transaktionshistorik" : "Purchase and transaction history"}</h3>'''
          if source.count(history_anchor) != 1:
              raise SystemExit(f"Expected one transaction-history anchor, found {source.count(history_anchor)}")
          source = source.replace(history_anchor, history_replacement, 1)

          for required in (
              "closedCashFlowPositions",
              "positions.length || portfolioTransactions.length",
              "Stängda positioner",
              "Closed positions",
              "Inga aktiva positioner",
              "No active positions",
              "ticker={identity.ticker}",
              "currency={identity.currency}",
          ):
              if required not in source:
                  raise SystemExit(f"Missing required patched marker: {required}")

          path.write_text(source)
          PY
      - name: Commit UI implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/portfolio/page.tsx
          git diff --cached --check
          git commit -m "fix(portfolio): keep closed history and cash flows visible"
          git push origin HEAD:portfolio-closed-cashflow-20260907
