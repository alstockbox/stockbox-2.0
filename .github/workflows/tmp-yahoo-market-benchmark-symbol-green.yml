name: Temporary Yahoo beta benchmark symbol GREEN

on:
  push:
    branches:
      - fix/etf-investment-company-coverage
    paths:
      - .github/workflows/tmp-yahoo-market-benchmark-symbol-green.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify RED source baseline
        run: git diff --exit-code 61b955a708361953e0182873f33ddd39b9982b5b -- src/lib/data/yahoo-market.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Yahoo benchmark symbol identity fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/data/yahoo-market.ts")
          text = path.read_text()
          old = "\n".join([
              "    const benchmarkResponse = benchmarkSymbol ? await requestChart(benchmarkSymbol) : null;",
              "    const benchmarkResult = benchmarkResponse?.ok ? firstChartResult(benchmarkResponse.data) : null;",
              "    const betaEstimate = benchmarkResult ? historicalWeeklyBeta(history, parseRows(benchmarkResult)) : null;",
          ])
          new = "\n".join([
              "    const benchmarkResponse = benchmarkSymbol ? await requestChart(benchmarkSymbol) : null;",
              "    const benchmarkResult = benchmarkResponse?.ok ? firstChartResult(benchmarkResponse.data) : null;",
              "    const benchmarkObservedSymbol = benchmarkResult ? stringValue(object(benchmarkResult.meta)?.symbol) : null;",
              "    const verifiedBenchmarkResult = benchmarkResult",
              "      && (!benchmarkObservedSymbol || (benchmarkSymbol && yahooSymbolsEquivalent(benchmarkSymbol, benchmarkObservedSymbol)))",
              "      ? benchmarkResult",
              "      : null;",
              "    const betaEstimate = verifiedBenchmarkResult ? historicalWeeklyBeta(history, parseRows(verifiedBenchmarkResult)) : null;",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"benchmark patch anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted Yahoo benchmark regressions
        run: npm test -- tests/data/yahoo-market-benchmark-symbol-identity.test.ts tests/data/yahoo-market.test.ts tests/data/yahoo-market-symbol-identity.test.ts
      - name: Typecheck Yahoo benchmark fix
        run: npm run typecheck
      - name: Commit source fix and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/yahoo-market.ts
          git rm .github/workflows/tmp-yahoo-market-benchmark-symbol-green.yml
          git commit -m "fix: verify Yahoo beta benchmark symbol identity"
          git push origin HEAD:fix/etf-investment-company-coverage
