name: Temporary Yahoo corporate actions GREEN

on:
  push:
    branches:
      - fix/yahoo-max-corporate-actions-20260909

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yahoo-max-corporate-actions-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal modern corporate-action patch
        run: python3 .github/tmp_patch_yahoo_corporate_actions.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Run focused Yahoo regressions
        run: npx vitest run tests/data/yahoo-corporate-actions-history.test.ts tests/data/yahoo-market-symbol-identity.test.ts tests/data/yahoo-market-benchmark-symbol-identity.test.ts tests/data/yahoo-long-history-symbol-identity.test.ts tests/data/market-history-currency-p0.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint changed source and test
        run: npx eslint src/lib/data/yahoo-market.ts tests/data/yahoo-corporate-actions-history.test.ts
      - name: Finalize clean commit and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-yahoo-corporate-actions-red.yml .github/tmp_patch_yahoo_corporate_actions.py
          git add src/lib/data/yahoo-market.ts
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          expected=".github/tmp_patch_yahoo_corporate_actions.py .github/workflows/tmp-yahoo-corporate-actions-red.yml src/lib/data/yahoo-market.ts "
          test "$actual" = "$expected"
          git commit -m "fix: extend Yahoo corporate-action history"
          git push origin HEAD:fix/yahoo-max-corporate-actions-20260909
