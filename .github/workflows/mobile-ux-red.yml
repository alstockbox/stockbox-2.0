name: Mobile UX Red Contract
on:
  push:
    branches:
      - work/mobile-analysis-menu-ux
jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/analysis/mobile-analysis-menu-ux.test.ts
