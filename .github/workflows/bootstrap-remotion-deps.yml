name: Bootstrap Remotion Dependencies

on:
  push:
    branches:
      - feat/growth-v3-plan2-media-factory
    paths:
      - ".github/workflows/bootstrap-remotion-deps.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/growth-v3-plan2-media-factory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install matching Remotion packages
        run: npm install remotion @remotion/cli @remotion/renderer --save-exact
      - name: Commit generated dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Remotion dependencies already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add Remotion media dependencies"
          git push origin HEAD:feat/growth-v3-plan2-media-factory
