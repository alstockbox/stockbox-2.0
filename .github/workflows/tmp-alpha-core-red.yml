name: Temporary Alpha Core Full Verification

on:
  push:
    branches:
      - feat/alpha-core-forward-port-20260910

permissions:
  contents: read

jobs:
  alpha-core-full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit full dependency tree
        run: npm audit --audit-level=high
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit suite excluding archetype file
        run: npm test -- --exclude tests/analysis/archetypes.test.ts
      - name: Archetype suite
        run: npm test -- tests/analysis/archetypes.test.ts
      - name: Production build
        run: npm run build
