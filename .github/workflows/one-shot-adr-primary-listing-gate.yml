name: One-shot ADR primary-listing gate patch

on:
  push:
    branches:
      - fix/etf-investment-company-coverage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fail-closed provider splice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/data/provider.ts")
          source = path.read_text()
          anchor = source.index("  const primaryListingCompany = buildDepositaryReceiptPrimaryListingCompany(")
          start_marker = "    if (primaryListingResolution.result.ok) {\n"
          end_marker = "  }\n\n  const providerOrchestrationMs = Date.now() - startedAt;"
          start = source.index(start_marker, anchor)
          end = source.index(end_marker, start)
          if not (anchor < start < end):
              raise SystemExit("ADR primary-listing provider markers are not ordered as expected")
          replacement = '''    const primaryListingMarket = primaryListingResolution.result.ok ? primaryListingResolution.result.data : null;
            if (primaryListingMarket && primaryListingResolution.source) {
              sources.push({
                ...primaryListingResolution.source,
                accessedAt,
                provider: primaryListingMarket.provider ?? primaryListingResolution.source.provider,
                capability: "market_data",
                dataAsOf: primaryListingMarket.date,
                version: providerAdapterVersion(primaryListingMarket.provider ?? primaryListingResolution.source.provider),
              });
            }
            const primaryListingReconciliation = reconcileDepositaryReceiptPrimaryListingPrice(
              analysisCompany,
              valuationInputs.market,
              primaryListingMarket,
            );
            if (primaryListingReconciliation.status !== "aligned") {
              valuationInputs = disableDepositaryReceiptValuationInputs(
                market,
                fundamentals,
                primaryListingReconciliation.reason,
              );
              warnings.push(`ADR/ADS primary-listing reconciliation disabled valuation: ${primaryListingReconciliation.reason}`);
            }
          '''
          updated = source[:start] + replacement + source[end:]
          if updated == source:
              raise SystemExit("Provider splice produced no change")
          path.write_text(updated)
          PY
      - run: npm ci
      - name: Prove targeted RED test is now GREEN
        run: npm test -- tests/data/provider-depositary-receipt-wiring.test.ts
      - name: Commit only the provider fix and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-adr-primary-listing-gate.yml
          git add src/lib/data/provider.ts
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/one-shot-adr-primary-listing-gate.yml src/lib/data/provider.ts "
          git commit -m "fix: require aligned ADR primary-listing quote"
          git push origin HEAD:fix/etf-investment-company-coverage
