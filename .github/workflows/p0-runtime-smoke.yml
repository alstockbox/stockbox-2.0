name: P0 Runtime release smoke

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  smoke-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          npm start -- -p 3001 > /tmp/stockbox-runtime.log 2>&1 &
          echo $! > /tmp/stockbox-runtime.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stockbox-runtime.log
          exit 1
      - name: Release smoke routes, auth redirects and security headers
        env:
          STOCKBOX_SMOKE_BASE_URL: http://127.0.0.1:3001
        run: npm run release:smoke:local
      - name: Show runtime log
        if: always()
        run: cat /tmp/stockbox-runtime.log || true
      - name: Remove temporary smoke workflow
        if: success()
        run: rm -f .github/workflows/p0-runtime-smoke.yml
      - name: Commit workflow cleanup
        if: success()
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary runtime smoke workflow"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
