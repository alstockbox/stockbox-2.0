name: Temporary Portfolio closed snapshot UI GREEN

on:
  push:
    branches:
      - "fix/portfolio-closed-snapshot-ui-20260907"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-closed-snapshot-ui-20260907
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply minimal GREEN patch
        run: python scripts/tmp_portfolio_closed_snapshot_ui_green.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused GREEN test
        run: npm test -- tests/portfolio/portfolio-closed-snapshot-ui.test.ts

      - name: Commit GREEN patch and remove temporary helpers
        run: |
          rm .github/workflows/tmp-portfolio-closed-snapshot-ui-green.yml
          rm scripts/tmp_portfolio_closed_snapshot_ui_green.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/portfolio/page.tsx src/components/portfolio/portfolio-analyzer.tsx .github/workflows/tmp-portfolio-closed-snapshot-ui-green.yml scripts/tmp_portfolio_closed_snapshot_ui_green.py
          git commit -m "fix(portfolio): expose final snapshot action"
          git push origin HEAD:fix/portfolio-closed-snapshot-ui-20260907
