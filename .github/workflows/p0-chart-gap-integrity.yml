name: P0 Chart gap integrity

on:
  push:
    branches:
      - stockbox/p0-release-hardening-20260831

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: stockbox/p0-release-hardening-20260831
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded chart gap P0 patch
        run: python3 scripts/apply-chart-gap-integrity-p0.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted chart gap tests
        run: npx vitest run tests/analysis/chart-gap-integrity-p0.test.ts tests/analysis/chart-geometry.test.ts tests/analysis/historical-view.test.tsx
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary chart-gap machinery
        run: rm -f .github/workflows/p0-chart-gap-integrity.yml scripts/apply-chart-gap-integrity-p0.py
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified chart gap integrity
        run: |
          git config user.name "StockBox Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve missing-data gaps in historical charts"
          git push origin HEAD:stockbox/p0-release-hardening-20260831
